apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-web-app
  labels:
    app: kubernetes-web-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kubernetes-web-app
  template:
    metadata:
      labels:
        app: kubernetes-web-app
    spec:
      containers:
        - name: web-app
          image: ghcr.io/ummadisettisindhuja2-netizen/kubernetes-application-deployment:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
